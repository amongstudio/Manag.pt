version: 2
project_name: pc-manager-agent
before:
  hooks:
    - make winres
builds:
  - id: agent
    main: ./cmd/agent
    binary: pc-manager-agent
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Version={{.Version}} -X github.com/pc-manager/agent/internal/config.DefaultServerURL={{ .Env.DEFAULT_SERVER_URL }}
  - id: agent-windows
    main: ./cmd/agent
    binary: pc-manager-agent
    goos: [windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -H windowsgui -X main.Version={{.Version}} -X github.com/pc-manager/agent/internal/config.DefaultServerURL={{ .Env.DEFAULT_SERVER_URL }}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
