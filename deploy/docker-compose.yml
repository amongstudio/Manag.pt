services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_WS_URL: ""
      NEXT_PUBLIC_OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
    expose:
      - "3000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATA_DIR: /data
      DATABASE_URL: file:/data/pcmanager.db
      ENROLLMENT_SECRET: ${ENROLLMENT_SECRET:?set ENROLLMENT_SECRET}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      UPDATE_SIGNING_SECRET: ${UPDATE_SIGNING_SECRET:?set UPDATE_SIGNING_SECRET}
      OPERATOR_TOKEN: ${OPERATOR_TOKEN:-}
      DEVICE_KEY_PEPPER: ${DEVICE_KEY_PEPPER:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      IP_ALLOWLIST: ${IP_ALLOWLIST:-}
      TRUST_PROXY: "1"
      TURN_URL: ${TURN_URL:-}
      TURN_SECRET: ${TURN_SECRET:-}
    volumes:
      - pcmanager_data:/data
    expose:
      - "4000"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pcmanager_data:
  caddy_data:
  caddy_config:
